name: Check Depop listings

# HOSTING MOVED BACK to GitHub Actions 2026-08-19: the fetch layer now goes
# through Bright Data Web Unlocker (depop_client.py), so GitHub's datacenter
# IPs never touch depop.com directly anymore -- the 2026-08-17 Cloudflare
# 403 blocks that forced the move to local Task Scheduler no longer apply.
# Cron is */10 (6 runs/hour, 4,464/month at 744 hours in a 31-day month)
# because Bright Data's Web Unlocker free tier is 5,000 requests/month --
# this keeps a safety margin under that cap. GitHub cron is best-effort:
# scheduled runs can fire late, especially at peak times. The state
# commit-back step below also keeps this repo active, which prevents
# GitHub's 60-day-inactivity auto-disable from ever triggering on this cron.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Without the scraper API key the fetch falls back to hitting depop.com
      # directly, which is Cloudflare-403-blocked from GitHub's IPs -- the run
      # would show green while fetching nothing (the exact silent failure mode
      # that killed the original Actions hosting). Fail loudly instead.
      - name: Fail if SCRAPER_API_KEY secret is missing
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          if [ -z "$SCRAPER_API_KEY" ]; then
            echo "::error::SCRAPER_API_KEY secret is not set. Add the Bright Data API token as a repo secret -- without it this run cannot fetch listings from a datacenter IP."
            exit 1
          fi

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          BRIGHTDATA_ZONE: ${{ vars.BRIGHTDATA_ZONE || 'web_unlocker1' }}
        run: python tracker.py

      - name: Commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json alerts_history.jsonl
          git diff --cached --quiet || (git commit -m "update pinger state [auto]" && git pull --rebase && git push)
