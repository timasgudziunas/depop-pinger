name: Check Depop listings

# HOSTING RETIRED 2026-08-17: every scheduled run since going live on
# 2026-08-15 (100/100 sampled) was Cloudflare-403-blocked — GitHub's
# datacenter IPs can't reach depop.com's search page at all. The pinger now
# runs locally via Windows Task Scheduler (see setup_task.ps1); the cron
# trigger is removed. workflow_dispatch is kept ONLY as a manual probe to
# re-test whether GitHub IPs are still blocked ("Checked 0 listings" + a
# 403 warning in the log = still blocked). State is no longer committed
# back (seen_listings.json is local-only and gitignored), so a probe run
# that somehow got through could re-alert on listings the local pinger
# already caught — acceptable for a rare manual test.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker (probe)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py
