name: Check Depop listings

# HOSTING MOVED BACK to GitHub Actions 2026-08-19: the fetch layer goes
# through a scraper API (depop_client.py) instead of hitting depop.com
# directly, so GitHub's datacenter IPs never touch depop.com -- the
# 2026-08-17 Cloudflare 403 blocks that forced the move to local Task
# Scheduler no longer apply. As of 2026-08-23 that scraper API is
# ScrapeBadger's dedicated Depop API (Bright Data Web Unlocker was
# abandoned the same day -- it compliance-blocks depop.com outright, see
# CLAUDE.md). Cron is */10 (6 runs/hour, 4,464 searches/31-day month at 744
# hours). Each run does one search call (10 credits) plus up to
# config.MAX_DETAIL_FETCHES_PER_RUN detail calls (10 credits each) --
# counting only the guaranteed search calls: 4,464 * 10 credits = 44,640
# credits/month at $0.15/1,000 credits = ~$6.70/month, inside the owner's
# $10/month budget (detail calls add to this but are bounded and typically
# far fewer than the cap in practice). GitHub cron is best-effort: scheduled
# runs can fire late, especially at peak times. The state commit-back step
# below also keeps this repo active, which prevents GitHub's
# 60-day-inactivity auto-disable from ever triggering on this cron.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Without the scraper API key the fetch falls back to hitting depop.com
      # directly, which is Cloudflare-403-blocked from GitHub's IPs -- the run
      # would show green while fetching nothing (the exact silent failure mode
      # that killed the original Actions hosting). Fail loudly instead.
      - name: Fail if SCRAPER_API_KEY secret is missing
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          if [ -z "$SCRAPER_API_KEY" ]; then
            echo "::error::SCRAPER_API_KEY secret is not set. Add the ScrapeBadger API key as a repo secret -- without it this run cannot fetch listings from a datacenter IP."
            exit 1
          fi

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python tracker.py

      - name: Commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json alerts_history.jsonl
          git diff --cached --quiet || (git commit -m "update pinger state [auto]" && git pull --rebase && git push)
